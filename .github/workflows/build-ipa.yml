name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ipa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive & package unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          which xcodegen || true

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project RevIQ.xcodeproj -scheme RevIQ || true

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RevIQ.xcodeproj \
            -scheme RevIQ \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RevIQ.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee build.log || exit 1

      - name: Verify archive contains app
        run: |
          APP_PATH=$(find build/RevIQ.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"; exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          ls -la "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry RevIQ-unsigned.ipa Payload
          unzip -l RevIQ-unsigned.ipa
          ls -lh RevIQ-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RevIQ-unsigned-ipa
          path: RevIQ-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
