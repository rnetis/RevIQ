name: RevIQ
options:
  bundleIdPrefix: dev.reviq
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"

targets:
  RevIQ:
    type: application
    platform: iOS
    sources:
      - path: RevIQ/Sources
      - path: RevIQ/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reviq.app
        PRODUCT_NAME: RevIQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: RevIQ/Support/Info.plist
      properties:
        CFBundleDisplayName: RevIQ
        CFBundleName: RevIQ
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "RevIQ uses Bluetooth to connect to your ELM327 OBD-II adapter and read live engine data such as speed, RPM and fuel usage."
        NSBluetoothPeripheralUsageDescription: "RevIQ uses Bluetooth to connect to your ELM327 OBD-II adapter."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  RevIQ:
    build:
      targets:
        RevIQ: all
    run:
      config: Debug
    archive:
      config: Release
